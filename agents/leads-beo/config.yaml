model:
  default: gpt-5.6-luna
  provider: openai-api
agent:
  max_turns: 24
  reasoning_effort: none
tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5
plugins:
  enabled:
    - leads-beo
# Telegram Q&A runs in the control API (read-only). Do not attach this
# bot to Hermes — Hermes tools can change the pipeline.
platforms: {}
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
unauthorized_dm_behavior: ignore
session_reset:
  mode: both
  idle_minutes: 240
  at_hour: 4
onboarding:
  profile_build: off
  seen:
    profile_build_offered: true
